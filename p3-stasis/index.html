<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.back{display:inline-block;flex-basis:100%;font-size:13px;color:#8d97b0;text-decoration:none;margin-bottom:2px}.back:hover,.back:focus-visible{color:#e7c46a}</style>
<title>絕亞 P3 時間停止練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen trainer — arena canvas left, briefing/result rail right; stacks on phones. Single deliberate dark look (raid HUD). */
:root{
  --bg:#0a0e16; --panel:#121927; --line:#253149; --fg:#e7ecf4; --muted:#8a97ae;
  --gold:#e3b04f; --justice:#f0873a; --chaser:#46c1e6; --ok:#5ccf88; --bad:#ee5959;
  --f-display:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%;touch-action:none;outline:none;border-radius:6px}
canvas:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.castbar{display:flex;align-items:center;gap:10px;margin:2px 2px 10px;font-family:var(--f-display);font-size:13px}
.castbar .lbl{min-width:92px;color:var(--gold)}
.bar{flex:1;height:8px;background:#0a0f19;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b07d22,var(--gold))}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px;text-align:right}
.rail{display:grid;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.sel{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
select,button{font:inherit;color:var(--fg);background:#0c1220;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer;font-weight:700}
button.primary{background:var(--gold);color:#1a1205;border-color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mine{display:flex;gap:12px;align-items:center}
.badge{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:#0c1220;flex:none}
.mine b{font-size:16px}
.mine p{margin:0;color:var(--muted);font-size:13px}
.verdict{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
ul.log{margin:0;padding-left:18px;color:var(--fg);font-size:13px}
ul.log li.bad{color:var(--bad)}
.macro{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.macro dt{color:var(--muted)} .macro dd{margin:0}
.macro .hl{color:var(--gold);font-weight:700}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-family:var(--f-display);font-size:20px}
.stats span{font-size:12px;color:var(--muted)}
.help{color:var(--muted);font-size:12.5px;margin:8px 2px 0}
kbd{font-family:var(--f-display);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--fg)}
</style>

<div class="wrap">
  <header>
    <a class="back" href="../">← 回模擬器選單</a>
    <h1>絕亞歷山大 <span>P3</span> · 時間停止</h1>
    <span class="sub">依ぬけまる式站位巨集練習：12 秒內走到正確位置，時間停止後判定。</span>
  </header>

  <div class="main">
    <div class="stage">
      <div class="castbar"><span class="lbl" id="castName">待機中</span><div class="bar"><i id="castFill"></i></div><span class="clock" id="clock">0:08</span></div>
      <canvas id="cv" width="720" height="720" tabindex="0" aria-label="場地，用方向鍵或點擊移動"></canvas>
      <p class="help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵移動，手機按住場地往手指方向走。<kbd>Space</kbd> 開始／再來一次。</p>
    </div>

    <div class="rail">
      <div class="card">
        <h2>設定</h2>
        <div class="row">
          <label class="sel" for="slot">職位
            <select id="slot">
              <option value="rand">隨機</option>
              <option>MT</option><option>ST</option><option>H1</option><option>H2</option>
              <option>D1</option><option>D2</option><option>D3</option><option>D4</option>
            </select>
          </label>
          <label class="sel" for="hint">提示
            <select id="hint"><option value="0">關</option><option value="1">顯示目標點</option></select>
          </label>
        </div>
        <div class="row" style="margin-top:10px"><button class="primary" id="go">開始</button></div>
      </div>

      <div class="card">
        <h2>你的 Debuff</h2>
        <div class="mine"><div class="badge" id="myIcon"></div><div><b id="myName">按「開始」</b><p id="myDesc">開場後會隨機分到四種之一。</p></div></div>
      </div>

      <div class="card" id="resultCard" hidden>
        <h2>結果</h2>
        <p class="verdict" id="verdict"></p>
        <ul class="log" id="log"></ul>
      </div>

      <div class="card">
        <h2>攻略巨集</h2>
        <dl class="macro" id="macro"></dl>
      </div>

      <div class="card">
        <h2>紀錄</h2>
        <div class="stats"><div><b id="sOk">0</b><span>成功</span></div><div><b id="sAll">0</b><span>總次數</span></div><div><b id="sStreak">0</b><span>連勝</span></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const W=720,R=20,SC=W/2/(R+2.2),SPEED=6.2;
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const C={gold:css('--gold'),j:css('--justice'),c:css('--chaser'),ok:css('--ok'),bad:css('--bad'),fg:css('--fg'),muted:css('--muted'),line:css('--line')};
const TH=['MT','ST','H1','H2'],DD=['D1','D2','D3','D4'];
const DEB={
  none:{name:'無點名',desc:'沒有 Debuff。TH 站胖子(Justice)北面，DD 站胖子南面，吃火焰噴射。'},
  near:{name:'接近強制（紅綠線）',desc:'和另一位紅綠線要靠近（超過約一個標點寬會死）。TH 站飛機(Chaser)北面，DD 站飛機南面，吃アルファソード。'},
  far:{name:'接近禁止（藍線）',desc:'和另一位藍線要遠離。TH 去胖子側最外紅點，DD 去飛機側最外紅點。'},
  bolt:{name:'加重罰（雷標記）',desc:'發動時帶易傷，不能再被任何攻擊打中。TH、DD 都去胖子側最外紅點。'}
};
const MACRO={TH:{none:'胖子北面',bolt:'胖子側面（靠最外）',far:'胖子側面（靠最外）',near:'飛機北面'},
             DD:{none:'胖子南面',bolt:'胖子側面（靠最外）',far:'飛機側面',near:'飛機南面'}};
const T_FREEZE=12,T_CLEAVE=12.8,T_END=15.5,CAST_START=9;
let st=null,keys={},ptr=null,last=0;
let stats={ok:0,all:0,streak:0};
try{const s=JSON.parse(localStorage.getItem('teaP3stasis')||'null');if(s)stats=s}catch(e){}
const saveStats=()=>{try{localStorage.setItem('teaP3stasis',JSON.stringify(stats))}catch(e){}};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function spot(role,deb,xJ,xC){
  const s=Math.sign(xJ),edge=17;
  if(deb==='none')return{x:xJ,y:role==='TH'?-2.2:2.2};
  if(deb==='near')return{x:xC,y:role==='TH'?-2.2:2.2};
  if(deb==='far'&&role==='DD')return{x:-s*edge,y:0};
  if(deb==='far')return{x:s*(edge+.6),y:0};
  return{x:s*edge,y:role==='TH'?-1.3:1.3};
}
function start(){
  const flip=Math.random()<.5,xJ=flip?9:-9,xC=-xJ;
  const types=['none','near','far','bolt'];
  const thT=shuffle(types),ddT=shuffle(types);
  let me=document.getElementById('slot').value; if(me==='rand')me=shuffle([...TH,...DD])[0];
  const ps=[...TH,...DD].map((n,i)=>{
    const role=i<4?'TH':'DD',deb=role==='TH'?thT[i]:ddT[i-4];
    const a=Math.random()*Math.PI*2,r=Math.random()*3.5;
    const p={n,role,deb,x:Math.cos(a)*r,y:3+Math.sin(a)*r,me:n===me,dead:false,react:.8+Math.random()*2.2,hits:0};
    p.goal=spot(role,deb,xJ,xC);p.goal.x+=(Math.random()-.5)*.6;p.goal.y+=(Math.random()-.5)*.6;
    p.ideal=spot(role,deb,xJ,xC);
    return p});
  st={t:0,xJ,xC,ps,me:ps.find(p=>p.me),frozen:false,resolved:false,cones:[],log:[],done:false};
  document.getElementById('resultCard').hidden=true;
  document.getElementById('go').textContent='重新開始';
  renderMine();renderMacro();cv.focus();
}
function renderMine(){
  const m=st.me,d=DEB[m.deb];
  document.getElementById('myName').textContent=`${m.n}：${d.name}`;
  document.getElementById('myDesc').textContent=d.desc;
  const b=document.getElementById('myIcon');b.innerHTML='';
  const c=document.createElement('canvas');c.width=c.height=88;c.style.width=c.style.height='40px';
  const g=c.getContext('2d');g.translate(44,44);g.scale(2,2);drawDebIcon(g,m.deb,0,0,1.4);b.appendChild(c);
}
function renderMacro(){
  const dl=document.getElementById('macro');dl.innerHTML='';
  for(const role of ['TH','DD'])for(const k of ['none','bolt','far','near']){
    const hl=st&&st.me.role===role&&st.me.deb===k;
    const dt=document.createElement('dt');dt.textContent=`${role} ${DEB[k].name.replace(/（.*）/,'').replace(/^(.*)$/,(s)=>({none:'無點名',bolt:'雷標記',far:'藍線',near:'紅綠線'})[k])}`;
    const dd=document.createElement('dd');dd.textContent='→ '+MACRO[role][k];
    if(hl){dt.className=dd.className='hl'}
    dl.append(dt,dd);
  }
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resolveDebuffs(){
  const ps=st.ps,L=st.log;
  for(const p of ps)if(Math.hypot(p.x,p.y)>R){p.dead=true;L.push([p,'掉出場外'])}
  const pair=k=>ps.filter(p=>p.deb===k);
  const [n1,n2]=pair('near'); if(dist(n1,n2)>6){for(const p of [n1,n2]){p.dead=true;L.push([p,`接近強制：兩人相距 ${dist(n1,n2).toFixed(1)}m，太遠`])}}
  const [f1,f2]=pair('far'); if(dist(f1,f2)<24){for(const p of [f1,f2]){p.dead=true;L.push([p,`接近禁止：兩人相距 ${dist(f1,f2).toFixed(1)}m，太近`])}}
  // cleaves on frozen positions
  const J={x:st.xJ,y:0},Cc={x:st.xC,y:0};
  const nearest=(o,n)=>ps.slice().sort((a,b)=>dist(a,o)-dist(b,o)).slice(0,n);
  for(const t of nearest(J,2))st.cones.push({o:J,a:Math.atan2(t.y,t.x-J.x),col:C.j,name:'火焰噴射',tgt:t});
  for(const t of nearest(Cc,3))st.cones.push({o:Cc,a:Math.atan2(t.y,t.x-Cc.x),col:C.c,name:'アルファソード',tgt:t});
}
const HALF=Math.PI/7.5,LEN=26;
function inCone(p,c){const dx=p.x-c.o.x,dy=p.y-c.o.y,d=Math.hypot(dx,dy);if(d>LEN)return false;if(d<1.2)return true;
  let da=Math.atan2(dy,dx)-c.a;da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)<=HALF}
function resolveCleaves(){
  for(const p of st.ps){const hs=st.cones.filter(c=>inCone(p,c));p.hits=hs.length;
    if(p.dead)continue;
    if(p.deb==='bolt'&&hs.length){p.dead=true;st.log.push([p,`加重罰：被${hs[0].name}打中`])}
    else if(hs.length>=2){p.dead=true;st.log.push([p,`同時吃到 ${hs.length} 道攻擊（${hs.map(h=>h.name).join('、')}）`])}}
}
function finish(){
  st.done=true;const m=st.me,off=dist(m,m.ideal);
  const myDeaths=st.log.filter(([p])=>p===m),wipe=st.log.length>0;
  const ok=!wipe&&off<=3.5;
  stats.all++;if(ok){stats.ok++;stats.streak++}else stats.streak=0;saveStats();showStats();
  const v=document.getElementById('verdict');
  v.textContent=ok?'成功處理':(myDeaths.length?'你倒了':(wipe?'有隊友倒地':'活下來了，但位置偏離攻略'));
  v.className='verdict '+(ok?'ok':'bad');
  const ul=document.getElementById('log');ul.innerHTML='';
  const add=(t,bad)=>{const li=document.createElement('li');li.textContent=t;if(bad)li.className='bad';ul.appendChild(li)};
  for(const [p,why] of st.log)add(`${p.n}${p.me?'（你）':''}：${why}`,true);
  add(`你的位置與攻略點相距 ${off.toFixed(1)}m（虛線圈為攻略點）`,off>3.5);
  add(`攻略：${m.role} ${({none:'無點名',bolt:'雷標記',far:'藍線',near:'紅綠線'})[m.deb]} → ${MACRO[m.role][m.deb]}`);
  document.getElementById('resultCard').hidden=false;
}
function showStats(){document.getElementById('sOk').textContent=stats.ok;document.getElementById('sAll').textContent=stats.all;document.getElementById('sStreak').textContent=stats.streak}

function step(dt){
  if(!st||st.done)return;
  st.t+=dt;
  if(!st.frozen){
    for(const p of st.ps){
      if(p.me){
        let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
        if(ptr&&!vx&&!vy){const dx=ptr.x-p.x,dy=ptr.y-p.y,d=Math.hypot(dx,dy);if(d>.3){vx=dx/d;vy=dy/d;if(d<SPEED*dt){vx*=d/(SPEED*dt);vy*=d/(SPEED*dt)}}}
        const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
        p.x+=vx*SPEED*dt;p.y+=vy*SPEED*dt;
      }else if(st.t>p.react){
        const dx=p.goal.x-p.x,dy=p.goal.y-p.y,d=Math.hypot(dx,dy),s=Math.min(d,SPEED*.92*dt);
        if(d>.05){p.x+=dx/d*s;p.y+=dy/d*s}
      }
    }
  }
  if(!st.frozen&&st.t>=T_FREEZE){st.frozen=true;resolveDebuffs()}
  if(st.frozen&&!st.resolved&&st.t>=T_CLEAVE){st.resolved=true;resolveCleaves()}
  if(st.t>=T_END)finish();
  const name=document.getElementById('castName'),fill=document.getElementById('castFill');
  if(st.t<CAST_START){name.textContent='Debuff 已給予';fill.style.width='0%'}
  else if(st.t<T_FREEZE){name.textContent='時間停止';fill.style.width=((st.t-CAST_START)/(T_FREEZE-CAST_START)*100)+'%'}
  else{name.textContent='時間停止中';fill.style.width='100%'}
  const gs=8+st.t;document.getElementById('clock').textContent=`0:${String(Math.floor(gs)).padStart(2,'0')}`;
}

// ---------- drawing ----------
const X=x=>W/2+x*SC,Y=y=>W/2+y*SC;
function drawDebIcon(g,k,x,y,s=1){
  g.save();g.translate(x,y);g.scale(s,s);g.lineWidth=2;
  if(k==='bolt'){g.fillStyle='#ffd84a';g.beginPath();g.moveTo(2,-11);g.lineTo(-6,1);g.lineTo(-1,1);g.lineTo(-3,11);g.lineTo(6,-2);g.lineTo(1,-2);g.lineTo(4,-11);g.closePath();g.fill()}
  else if(k==='far'){g.strokeStyle='#4f8dff';g.beginPath();g.arc(0,0,8,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(-5,0);g.lineTo(5,0);g.stroke()}
  else if(k==='near'){g.strokeStyle='#ff5d5d';g.beginPath();g.arc(-3,0,6,0,Math.PI*2);g.stroke();g.strokeStyle='#5fe07a';g.beginPath();g.arc(3,0,6,0,Math.PI*2);g.stroke()}
  else{g.strokeStyle=C.muted;g.setLineDash([2,3]);g.beginPath();g.arc(0,0,8,0,Math.PI*2);g.stroke()}
  g.restore();
}
function drawArena(){
  cx.clearRect(0,0,W,W);
  const grd=cx.createRadialGradient(W/2,W/2,10,W/2,W/2,R*SC);grd.addColorStop(0,'#1b2438');grd.addColorStop(1,'#111827');
  cx.fillStyle=grd;cx.beginPath();cx.arc(W/2,W/2,R*SC,0,Math.PI*2);cx.fill();
  // gear teeth around rim
  cx.strokeStyle='#33415f';cx.lineWidth=2;
  for(let i=0;i<72;i++){const a=i/72*Math.PI*2;cx.beginPath();cx.moveTo(X(Math.cos(a)*R),Y(Math.sin(a)*R));cx.lineTo(X(Math.cos(a)*(R+.9)),Y(Math.sin(a)*(R+.9)));cx.stroke()}
  cx.strokeStyle='#3a4a6b';cx.beginPath();cx.arc(W/2,W/2,R*SC,0,Math.PI*2);cx.stroke();
  cx.strokeStyle='#1f2a40';cx.lineWidth=1;
  for(const r of [6,12])cx.beginPath(),cx.arc(W/2,W/2,r*SC,0,Math.PI*2),cx.stroke();
  cx.beginPath();cx.moveTo(X(-R),Y(0));cx.lineTo(X(R),Y(0));cx.moveTo(X(0),Y(-R));cx.lineTo(X(0),Y(R));cx.stroke();
  // red dots + half-moon devices at E/W
  for(const s of [-1,1]){
    cx.fillStyle='#d64545';cx.beginPath();cx.arc(X(s*17),Y(0),.55*SC,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#c9a227';cx.lineWidth=3;cx.beginPath();cx.arc(X(s*R),Y(0),2.2*SC,s>0?Math.PI*.5:-Math.PI*.5,s>0?Math.PI*1.5:Math.PI*.5);cx.stroke();
  }
  cx.fillStyle=C.muted;cx.font='700 16px "Chakra Petch",sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('N',X(0),Y(-R-1.5));cx.fillText('S',X(0),Y(R+1.5));cx.fillText('E',X(R+1.5),Y(0));cx.fillText('W',X(-R-1.5),Y(0));
}
function drawBoss(x,col,label,kind){
  cx.save();cx.translate(X(x),Y(0));
  cx.fillStyle=col+'33';cx.strokeStyle=col;cx.lineWidth=3;
  if(kind==='J'){cx.beginPath();cx.roundRect(-1.6*SC,-1.6*SC,3.2*SC,3.2*SC,8);cx.fill();cx.stroke()}
  else{cx.beginPath();cx.moveTo(0,-1.9*SC);cx.lineTo(1.7*SC,1.3*SC);cx.lineTo(-1.7*SC,1.3*SC);cx.closePath();cx.fill();cx.stroke()}
  cx.fillStyle=col;cx.font='700 15px "Noto Sans TC",sans-serif';cx.textAlign='center';cx.fillText(label,0,2.9*SC);
  cx.restore();
}
function draw(){
  drawArena();
  if(!st){cx.fillStyle=C.fg;cx.font='700 22px "Noto Sans TC",sans-serif';cx.textAlign='center';cx.fillText('按「開始」或 Space',W/2,W/2-10);
    cx.fillStyle=C.muted;cx.font='15px "Noto Sans TC",sans-serif';cx.fillText('胖子＝Justice，飛機＝Chaser，左右每次隨機',W/2,W/2+20);return}
  drawBoss(st.xJ,C.j,'胖子 Justice','J');drawBoss(st.xC,C.c,'飛機 Chaser','C');
  // cones
  if(st.frozen)for(const c of st.cones){cx.fillStyle=c.col+(st.resolved?'55':'22');cx.strokeStyle=c.col;cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(X(c.o.x),Y(c.o.y));cx.arc(X(c.o.x),Y(c.o.y),LEN*SC,c.a-HALF,c.a+HALF);cx.closePath();cx.fill();cx.stroke()}
  const hint=document.getElementById('hint').value==='1';
  if(hint||st.done){const g=st.me.ideal;cx.strokeStyle=C.gold;cx.setLineDash([6,5]);cx.lineWidth=2;cx.beginPath();cx.arc(X(g.x),Y(g.y),1.6*SC,0,Math.PI*2);cx.stroke();cx.setLineDash([])}
  // tethers
  const pair=k=>st.ps.filter(p=>p.deb===k);
  const [n1,n2]=pair('near'),[f1,f2]=pair('far');
  let lg=cx.createLinearGradient(X(n1.x),Y(n1.y),X(n2.x),Y(n2.y));lg.addColorStop(0,'#ff5d5d');lg.addColorStop(1,'#5fe07a');
  cx.lineWidth=3;cx.strokeStyle=lg;cx.beginPath();cx.moveTo(X(n1.x),Y(n1.y));cx.lineTo(X(n2.x),Y(n2.y));cx.stroke();
  cx.strokeStyle='#4f8dff';cx.beginPath();cx.moveTo(X(f1.x),Y(f1.y));cx.lineTo(X(f2.x),Y(f2.y));cx.stroke();
  for(const p of st.ps){
    const px=X(p.x),py=Y(p.y),r=p.me?13:10;
    cx.fillStyle=p.dead?'#3a3f4a':(p.role==='TH'?(p.n[0]==='H'?'#3fae6a':'#3d6fd6'):'#c2464a');
    cx.strokeStyle=p.me?C.gold:'#0a0e16';cx.lineWidth=p.me?3:2;
    cx.beginPath();cx.arc(px,py,r,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle='#fff';cx.font=`700 ${p.me?12:10}px "Chakra Petch",sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.n,px,py+1);
    if(p.deb==='bolt')drawDebIcon(cx,'bolt',px,py-r-12,1);
    if(p.dead){cx.strokeStyle=C.bad;cx.lineWidth=3;cx.beginPath();cx.moveTo(px-8,py-8);cx.lineTo(px+8,py+8);cx.moveTo(px+8,py-8);cx.lineTo(px-8,py+8);cx.stroke()}
    if(p.me&&!st.done){cx.fillStyle=C.gold;cx.font='700 13px "Noto Sans TC",sans-serif';cx.fillText('你',px,py+r+12)}
  }
  if(st.frozen){cx.fillStyle='rgba(120,150,220,.10)';cx.beginPath();cx.arc(W/2,W/2,R*SC,0,Math.PI*2);cx.fill();
    cx.fillStyle='#c9d8ff';cx.font='700 26px "Noto Sans TC",sans-serif';cx.textAlign='center';cx.fillText('時間停止',W/2,Y(-R+3.2))}
}
function loop(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;step(dt);draw();requestAnimationFrame(loop)}

// ---------- input ----------
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();if(!st||st.done)start();return}
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){if(document.activeElement.tagName!=='SELECT')e.preventDefault();keys[k]=true}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{keys={};ptr=null});
const toWorld=e=>{const r=cv.getBoundingClientRect();return{x:((e.clientX-r.left)/r.width*W-W/2)/SC,y:((e.clientY-r.top)/r.height*W-W/2)/SC}};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr=toWorld(e)});
cv.addEventListener('pointermove',e=>{if(ptr)ptr=toWorld(e)});
const up=()=>{ptr=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.getElementById('go').addEventListener('click',start);
showStats();renderMacro();requestAnimationFrame(loop);
})();
</script>
